name: FilmCraft workspace and WASM
run-name: Verify FilmCraft b37d77e on Linux and WASM

on:
  push:
    branches: [codex/verify-filmcraft-b37d77e]

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace tests
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@0bef64f155fcea81edbd9542381777358bfbdcf4
    with:
      toolchain: '1.95.0'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      gate-timeout-minutes: 115
      dev-debug: '0'
      tools: ''
      targets: ''
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libasound2-dev
      env: |
        FILMCRAFT_REQUIRE_ORACLES=1
        RUST_TEST_THREADS=2
      setup-command: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/filmcraft-oracle"
        archive="$RUNNER_TEMP/filmcraft-oracle.tar.xz"
        curl --fail --location --retry 3 --output "$archive" https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-21-12-37/ffmpeg-n8.1.3-39-g660b5aa7db-linux64-gpl-8.1.tar.xz
        printf '%s  %s\n' 85d6d2c617fa4e2bee9ea105b5532c66ac866ada0a9a650a088e6fb096c7eeff "$archive" | sha256sum --check
        tar -xJf "$archive" --strip-components=2 -C "$RUNNER_TEMP/filmcraft-oracle" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
        "$RUNNER_TEMP/filmcraft-oracle/ffmpeg" -version | sed -n '1p'
        printf '%s\n' "$RUNNER_TEMP/filmcraft-oracle" >> "$GITHUB_PATH"
      command: |
        set -euo pipefail
        git fetch --depth=1 origin b37d77e86ead6ead1db3a350cdfd632b4ee9c537
        git checkout --detach b37d77e86ead6ead1db3a350cdfd632b4ee9c537
        git rev-parse HEAD
        cd filmcraft
        status=0
        cargo test --locked --workspace --lib --bins --tests --no-fail-fast || status=1
        cargo test --locked --workspace --doc || status=1
        git diff --exit-code -- Cargo.lock
        exit "$status"

  wasm:
    name: WASM check
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@0bef64f155fcea81edbd9542381777358bfbdcf4
    with:
      toolchain: '1.95.0'
      targets: wasm32-unknown-unknown
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 60
      dev-debug: '0'
      tools: ''
      command: |
        set -euo pipefail
        git fetch --depth=1 origin b37d77e86ead6ead1db3a350cdfd632b4ee9c537
        git checkout --detach b37d77e86ead6ead1db3a350cdfd632b4ee9c537
        git rev-parse HEAD
        cd filmcraft
        cargo xtask wasm
        git diff --exit-code -- Cargo.lock
