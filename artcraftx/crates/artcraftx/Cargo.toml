[package]
name = "artcraftx"
version = "0.0.1"
description = "ArtCraftX"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
publish = false

# [lints.rust]
# unused_imports = "forbid"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "artcraftx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Workspace hack (faster compile times)
workspace-build-acceleration.workspace =  true

# Internal
artcraft_client.workspace = true
router.workspace = true
build_metadata.workspace = true
cookie_store_wrapper.workspace = true
errors.workspace = true
fal_client.workspace = true
file_hashing.workspace = true
filesys.workspace = true
grok_consumer_client.workspace = true
higgsfield_client.workspace = true
grok_consumer_statsig.workspace = true
uuid_utils.workspace = true
browser_emulation.workspace = true
images.workspace = true
local_files_database.workspace = true
memory_store.workspace = true
midjourney_client.workspace = true
mimetypes.workspace = true
primitives.workspace = true
sqlite_database.workspace = true
thumbnails.workspace = true
core_types.workspace = true
models.workspace = true
sqlite_identifiers.workspace = true
url_utils.workspace = true
web_base64.workspace = true

# External
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes = "1.10.1"
chrono.workspace = true
directories = "6.0.0"
dirs = "6.0.0"
discord-rich-presence = "1.1.0"
futures = "0.3"
image = "0.25.5"
indexmap.workspace = true
log.workspace = true
once_cell.workspace = true
os_info = { version = "3.12.0", default-features = false }
rand.workspace = true
reqwest = { workspace = true, features = ["multipart", "stream"], default-features = false } # NB(bt,2025-03-10): default-features = false on Windows while I debug openssl / rustls
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-upload.workspace = true
tauri.workspace = true
tempdir.workspace = true
tempfile.workspace = true
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "fs", "sync", "time", "macros"] }
tokio-util.workspace = true
toml.workspace = true
url.workspace = true

# NB: We need to vendor this in so that we can access the cookies inside via the private API
tauri-plugin-http = { path = "../vendor/tauri-plugin-http" }
tauri-plugin-opener = "2"

# # Transparent title bar on MacOS
# # NB: See the notes here:
# # https://v2.tauri.app/learn/window-customization/
# [target."cfg(target_os = \"macos\")".dependencies]
# cocoa = "0.26"

[dev-dependencies]
serial_test = "3.2.0"
